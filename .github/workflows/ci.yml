name: CI

on:
  push:
    branches: [main]
    paths:
      - install.sh
      - tests/**
      - .github/workflows/ci.yml
  pull_request:
    branches: [main]
    paths:
      - install.sh
      - tests/**
      - .github/workflows/ci.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check Bash syntax
        run: bash -n install.sh tests/test_install.sh tests/test_install_system.sh
      - name: Run ShellCheck
        run: shellcheck install.sh tests/test_install.sh tests/test_install_system.sh
      - name: Run self-test
        run: bash tests/test_install.sh
      - name: Check legacy Ubuntu compatibility
        run: docker run --rm -v "$PWD:/review:ro" ubuntu:14.04 bash /review/tests/test_install.sh
      - name: Check APT conflicts in a disposable container
        run: |
          docker run --rm -v "$PWD:/review:ro" ubuntu:24.04 bash -c \
            'apt-get update && apt-get install -y python3 && bash /review/tests/test_install_system.sh'
